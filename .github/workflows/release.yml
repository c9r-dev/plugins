name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release the plugin.json version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version .claude-plugin/plugin.json)"
          # --exit-code returns 2 when no ref matches; any other failure stops the job.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "$tag is already released"
          elif [ "$status" -eq 2 ]; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          else
            exit "$status"
          fi
