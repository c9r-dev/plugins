name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Test each plugin
        env:
          CLAUDE_CODE_ENABLE_FUNCTION_HOOKS: "1"
        run: |
          failed=""
          for plugin in plugins/*/; do
            echo "::group::$plugin"
            (cd "$plugin" && npm test) || failed="$failed $plugin"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failed:$failed"
            exit 1
          fi
