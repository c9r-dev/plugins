name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test each plugin and the shared code
        run: |
          failed=""
          for dir in shared/ plugins/*/; do
            echo "::group::$dir"
            (cd "$dir" && node --test) || failed="$failed $dir"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failed:$failed"
            exit 1
          fi

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [shared, plugins/soft-lint, plugins/browser-check-visual]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dev dependencies
        run: corepack enable && yarn install --immutable
      - run: yarn typecheck
